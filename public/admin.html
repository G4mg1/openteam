<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Mirox Admin Console</title>
  <link href="https://cdn.jsdelivr.net/npm/remixicon@4.9.0/fonts/remixicon.css" rel="stylesheet">
  <style>
    *,*::before,*::after{box-sizing:border-box}
    :root{--bg:#fafafb;--panel:#fff;--panel-2:#f7f7fa;--border:#e8e8ef;--text:#0a0a0c;--text-muted:#64646f;--text-faint:#9494a0;--accent:#c4694b;--accent-hover:#a8503a;--accent-soft:rgba(196,105,75,.10);--radius:10px;--radius-lg:14px;--radius-xl:20px;--shadow-lg:0 8px 28px rgba(20,20,40,.09)}
    :root[data-mode="dark"]{--bg:#0a0a0d;--panel:#15151b;--panel-2:#1d1d24;--border:#26262f;--text:#f4f4f8;--text-muted:#a0a0ab;--text-faint:#6a6a75}
    html{min-height:100%;background:var(--bg)}
    body{margin:0;min-height:100vh;font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--text);font-size:15px;line-height:1.6;-webkit-font-smoothing:antialiased}
    button,input,select{font:inherit;color:inherit}
    img{max-width:100%;display:block}
    :root[data-mode="dark"] .theme-aware-logo{filter:invert(1) brightness(1.15)}
    body { display: block; overflow-y: auto; padding: 24px; }
    .admin-wrap { max-width: 1200px; margin: 0 auto; }
    .admin-header { display: flex; align-items: center; gap: 12px; margin-bottom: 24px; }
    .admin-header h1 { font-size: 22px; font-weight: 700; }
    .admin-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 16px; margin-bottom: 24px; }
    .stat-card { padding: 18px; border-radius: var(--radius-lg); border: 1px solid var(--border); background: var(--panel); }
    .stat-card h3 { font-size: 12px; text-transform: uppercase; letter-spacing: 0.05em; color: var(--text-faint); margin-bottom: 6px; }
    .stat-card .value { font-size: 28px; font-weight: 700; }
    .admin-section { margin-bottom: 28px; }
    .admin-section h2 { font-size: 16px; font-weight: 600; margin-bottom: 12px; }
    .log-table { width: 100%; border-collapse: collapse; font-size: 13px; border: 1px solid var(--border); border-radius: var(--radius-lg); overflow: hidden; }
    .log-table th, .log-table td { text-align: left; padding: 8px 12px; border-bottom: 1px solid var(--border); }
    .log-table th { font-weight: 600; color: var(--text-faint); font-size: 11px; text-transform: uppercase; background: var(--panel-2); }
    .admin-input { padding: 8px 12px; border-radius: var(--radius); border: 1px solid var(--border); background: var(--panel-2); font-size: 14px; width: 100%; max-width: 300px; }
    .admin-btn { padding: 8px 16px; border-radius: var(--radius); background: var(--accent); color: #fff; font-size: 14px; font-weight: 500; border: none; cursor: pointer; }
    .admin-btn:hover { background: var(--accent-hover); }
    .admin-btn:disabled { opacity: .55; cursor: not-allowed; }
    .admin-btn.ghost { background: transparent; color: var(--text-muted); border: 1px solid var(--border); }
    .admin-btn.ghost:hover { background: var(--panel-2); color: var(--text); }

    /* Password gate */
    .gate {
      position: fixed; inset: 0; z-index: 999;
      background: var(--bg);
      display: flex; align-items: center; justify-content: center; padding: 20px;
    }
    .gate.hidden { display: none; }
    .gate-card {
      width: 100%; max-width: 380px;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: var(--radius-xl);
      padding: 32px 28px;
      box-shadow: var(--shadow-lg);
      text-align: center;
    }
    .gate-icon {
      width: 56px; height: 56px; border-radius: 14px;
      background: var(--accent-soft); color: var(--accent);
      display: grid; place-items: center; font-size: 26px;
      margin: 0 auto 16px;
    }
    .gate-title { font-size: 20px; font-weight: 700; margin-bottom: 6px; }
    .gate-sub { font-size: 13.5px; color: var(--text-muted); margin-bottom: 22px; }
    .gate-input {
      width: 100%; padding: 12px 14px; border-radius: var(--radius);
      border: 1px solid var(--border); background: var(--panel-2);
      font-size: 15px; outline: none;
      transition: border-color .15s;
    }
    .gate-input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
    .gate-btn {
      width: 100%; margin-top: 14px; padding: 12px;
      border-radius: var(--radius); border: none;
      background: var(--accent); color: #fff;
      font-size: 14.5px; font-weight: 600; cursor: pointer;
    }
    .gate-btn:hover { background: var(--accent-hover); }
    .gate-btn:disabled { opacity: .5; cursor: not-allowed; }
    .gate-err { color: #dc2626; font-size: 13px; margin-top: 10px; min-height: 18px; }

    .row-error { color: #dc2626; }
    .row-muted { color: var(--text-faint); }

    @media (max-width:640px){body{padding:14px!important}.admin-header{flex-wrap:wrap}.admin-header h1{font-size:19px}.admin-grid{grid-template-columns:1fr 1fr}.stat-card .value{font-size:24px}}
  </style>
</head>
<body>
  <!-- Password gate -->
  <div class="gate" id="gate">
    <div class="gate-card">
      <div class="gate-icon"><i class="ri-lock-2-line"></i></div>
      <div class="gate-title">Admin access</div>
      <div class="gate-sub">Enter the admin password to continue.</div>
      <input type="password" id="gatePass" class="gate-input" placeholder="Password" autocomplete="current-password">
      <button id="gateBtn" class="gate-btn">Unlock</button>
      <div class="gate-err" id="gateErr"></div>
    </div>
  </div>

  <div class="admin-wrap" id="adminWrap" style="display:none;">
    <div class="admin-header">
      <img src="/logo.png" alt="MiroxAI" class="theme-aware-logo" style="width:32px;height:32px;border-radius:8px;">
      <h1>Mirox Admin Console</h1>
      <button id="adminRefresh" class="admin-btn ghost" style="margin-left:auto;">Refresh</button>
      <button id="adminLogout" class="admin-btn ghost">Lock</button>
    </div>

    <div class="admin-grid">
      <div class="stat-card"><h3>Total Users</h3><div class="value" id="statUsers">—</div></div>
      <div class="stat-card"><h3>Chats Total</h3><div class="value" id="statChats">—</div></div>
      <div class="stat-card"><h3>Images Generated</h3><div class="value" id="statImages">—</div></div>
      <div class="stat-card"><h3>User Events</h3><div class="value" id="statEvents">—</div></div>
    </div>

    <div class="admin-section">
      <h2>User Management</h2>
      <div style="display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap;align-items:center;">
        <input type="text" id="adminUserEmail" class="admin-input" placeholder="User email">
        <select id="adminTierSelect" class="admin-input" style="max-width:160px;">
          <option value="free">Free</option>
          <option value="pro">Pro</option>
          <option value="ultimate">Ultimate</option>
        </select>
        <button id="adminSetTierBtn" class="admin-btn">Set Tier</button>
        <span id="adminTierMsg" style="font-size:13px;color:var(--text-muted);"></span>
      </div>
      <div style="overflow-x:auto;">
        <table class="log-table" id="adminUserTable">
          <thead><tr><th>Email</th><th>Name</th><th>Tier</th><th>Eclipse used</th><th>Last Login</th></tr></thead>
          <tbody><tr><td colspan="5" class="row-muted">Loading…</td></tr></tbody>
        </table>
      </div>
    </div>
  </div>

  <script>
    const API = '/api/admin';
    const TOKEN_KEY = 'mirox_admin_token';
    const DEFAULT_TIMEOUT_MS = 15000;
    const $ = s => document.querySelector(s);

    let loading = false;

    function getAdminToken() { try { return sessionStorage.getItem(TOKEN_KEY) || ''; } catch { return ''; } }
    function setAdminToken(t) { try { t ? sessionStorage.setItem(TOKEN_KEY, t) : sessionStorage.removeItem(TOKEN_KEY); } catch {} }

    /* HTML escape — user data goes straight into innerHTML */
    function escapeHtml(s) {
      return String(s == null ? '' : s)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    /* Timestamps are stored in SECONDS (Math.floor(Date.now()/1000)).
       Anything below 1e12 is treated as seconds and multiplied. */
    function formatTs(v) {
      if (v === undefined || v === null || v === '') return '—';
      let n = Number(v);
      if (!isFinite(n) || n <= 0) return '—';
      if (n < 1e12) n *= 1000;
      try { return new Date(n).toLocaleString(); } catch { return '—'; }
    }

    /* Fetch with hard timeout so we never hang on a stuck backend */
    async function adminFetch(path, opts = {}, timeoutMs = DEFAULT_TIMEOUT_MS) {
      const headers = { 'Content-Type': 'application/json', ...(opts.headers || {}) };
      const t = getAdminToken();
      if (t) headers['X-Admin-Token'] = t;
      const ctrl = new AbortController();
      const timer = setTimeout(() => { try { ctrl.abort(); } catch {} }, timeoutMs);
      try {
        return await fetch(API + path, { ...opts, headers, credentials: 'same-origin', signal: ctrl.signal });
      } finally {
        clearTimeout(timer);
      }
    }

    async function readJson(res) {
      try { return await res.json(); }
      catch { return null; }
    }

    function showGate() {
      $('#gate').classList.remove('hidden');
      $('#adminWrap').style.display = 'none';
    }
    function showAdminShell() {
      $('#gate').classList.add('hidden');
      $('#adminWrap').style.display = 'block';
    }

    /* ---- Password gate ---- */
    async function tryUnlock() {
      const pass = $('#gatePass').value;
      const btn = $('#gateBtn');
      const err = $('#gateErr');
      err.textContent = '';
      if (!pass) { err.textContent = 'Enter a password.'; return; }
      btn.disabled = true; btn.textContent = 'Checking…';
      try {
        const res = await adminFetch('/auth', {
          method: 'POST',
          body: JSON.stringify({ password: pass }),
        }, 10000);
        const data = await readJson(res);
        if (data && data.ok && data.token) {
          setAdminToken(data.token);
          showAdminShell();
          await refreshStats();
        } else {
          err.textContent = (data && data.error) || 'Invalid password';
        }
      } catch (e) {
        err.textContent = e.name === 'AbortError' ? 'Request timed out' : 'Server error';
      } finally {
        btn.disabled = false; btn.textContent = 'Unlock';
      }
    }

    $('#gateBtn')?.addEventListener('click', tryUnlock);
    $('#gatePass')?.addEventListener('keydown', e => { if (e.key === 'Enter') tryUnlock(); });

    $('#adminLogout')?.addEventListener('click', () => {
      setAdminToken('');
      $('#gatePass').value = '';
      $('#gateErr').textContent = '';
      showGate();
    });

    $('#adminRefresh')?.addEventListener('click', () => { refreshStats(); });

    /* ---- Stats loading ---- */
    function setStatsPlaceholder(text) {
      $('#statUsers').textContent = text;
      $('#statChats').textContent = text;
      $('#statImages').textContent = text;
      $('#statEvents').textContent = text;
    }

    function renderTable(users) {
      const tbody = $('#adminUserTable tbody');
      const entries = Object.entries(users || {})
        .filter(([_, u]) => u && typeof u === 'object');
      if (!entries.length) {
        tbody.innerHTML = '<tr><td colspan="5" class="row-muted">No users yet</td></tr>';
        return;
      }
      tbody.innerHTML = entries.map(([email, u]) => `
        <tr>
          <td>${escapeHtml(email)}</td>
          <td>${escapeHtml(u.name || '—')}</td>
          <td><span style="padding:2px 8px;border-radius:99px;background:var(--accent-soft);color:var(--accent);font-size:12px;font-weight:600;">${escapeHtml(u.tier || 'free')}</span></td>
          <td>${escapeHtml(u.eclipse_used ?? 0)}</td>
          <td>${escapeHtml(formatTs(u.last_login))}</td>
        </tr>`).join('');
    }

    async function refreshStats() {
      if (loading) return;
      loading = true;
      const tbody = $('#adminUserTable tbody');
      const refreshBtn = $('#adminRefresh');
      try {
        if (refreshBtn) refreshBtn.disabled = true;
        tbody.innerHTML = '<tr><td colspan="5" class="row-muted">Loading…</td></tr>';
        setStatsPlaceholder('…');

        const res = await adminFetch('/stats');
        if (res.status === 401) {
          setAdminToken('');
          showGate();
          return;
        }
        if (!res.ok) {
          tbody.innerHTML = `<tr><td colspan="5" class="row-error">Server error (HTTP ${res.status})</td></tr>`;
          setStatsPlaceholder('—');
          return;
        }
        const data = await readJson(res);
        if (!data || !data.ok) {
          tbody.innerHTML = '<tr><td colspan="5" class="row-error">Invalid response from server</td></tr>';
          setStatsPlaceholder('—');
          return;
        }

        $('#statUsers').textContent  = data.users  ?? 0;
        $('#statChats').textContent  = data.chats  ?? 0;
        $('#statImages').textContent = data.images ?? 0;
        $('#statEvents').textContent = data.events ?? 0;
        renderTable(data.users_data);
      } catch (e) {
        const msg = e && e.name === 'AbortError' ? 'Request timed out' : 'Failed to load stats';
        tbody.innerHTML = `<tr><td colspan="5" class="row-error">${escapeHtml(msg)}</td></tr>`;
        setStatsPlaceholder('—');
      } finally {
        loading = false;
        if (refreshBtn) refreshBtn.disabled = false;
      }
    }

    /* ---- Set tier ---- */
    $('#adminSetTierBtn')?.addEventListener('click', async () => {
      const email = $('#adminUserEmail').value.trim().toLowerCase();
      const tier = $('#adminTierSelect').value;
      const msg = $('#adminTierMsg');
      const btn = $('#adminSetTierBtn');
      msg.textContent = '';
      msg.style.color = 'var(--text-muted)';
      if (!email) { msg.textContent = 'Enter a user email'; msg.style.color = '#dc2626'; return; }
      btn.disabled = true;
      msg.textContent = 'Updating…';
      try {
        const res = await adminFetch('/set-tier', {
          method: 'POST',
          body: JSON.stringify({ email, tier }),
        }, 10000);
        if (res.status === 401) { setAdminToken(''); showGate(); return; }
        const data = await readJson(res);
        if (data && data.ok) {
          msg.textContent = `Updated ${email} → ${tier}`;
          msg.style.color = 'var(--accent)';
          await refreshStats();
        } else {
          msg.textContent = (data && data.error) || `Failed (HTTP ${res.status})`;
          msg.style.color = '#dc2626';
        }
      } catch (e) {
        msg.textContent = e && e.name === 'AbortError' ? 'Request timed out' : 'Server error';
        msg.style.color = '#dc2626';
      } finally {
        btn.disabled = false;
      }
    });

    /* ---- Boot ----
       Single verify+render pass — no more double-fetch. */
    (async function boot() {
      const t = getAdminToken();
      if (!t) { showGate(); return; }
      try {
        const res = await adminFetch('/stats');
        if (res.status === 401) { setAdminToken(''); showGate(); return; }
        if (!res.ok) { setAdminToken(''); showGate(); return; }
        const data = await readJson(res);
        if (!data || !data.ok) { setAdminToken(''); showGate(); return; }
        showAdminShell();
        $('#statUsers').textContent  = data.users  ?? 0;
        $('#statChats').textContent  = data.chats  ?? 0;
        $('#statImages').textContent = data.images ?? 0;
        $('#statEvents').textContent = data.events ?? 0;
        renderTable(data.users_data);
      } catch {
        showGate();
      }
    })();
  </script>
</body>
</html>
