<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>Mirox</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/remixicon@4.2.0/fonts/remixicon.css" rel="stylesheet">
<link rel="stylesheet" href="/style.css">
</head>
<body>

<div class="app">
  <aside class="sidebar" id="sidebar">
    <div class="brand">
      <div class="brand-mark">M</div>
      <span class="brand-name">Mirox</span>
      <button class="icon-btn mobile-close" id="closeSidebar"><i class="ri-close-line"></i></button>
    </div>

    <button class="new-chat" id="newChatBtn">
      <i class="ri-add-line"></i><span>New chat</span>
    </button>

    <div class="history" id="history"></div>

    <div class="user-bar">
      <div class="user-avatar" id="userAvatar">?</div>
      <div class="user-meta">
        <div class="user-name" id="userName">Sign in</div>
        <div class="user-tier" id="userTier">—</div>
      </div>
      <button class="icon-btn" id="themeBtn" title="Theme"><i class="ri-moon-line"></i></button>
    </div>
  </aside>

  <div class="scrim" id="scrim"></div>

  <main class="main">
    <header class="topbar">
      <button class="icon-btn mobile-only" id="openSidebar"><i class="ri-menu-line"></i></button>

      <div class="title-wrap">
        <h1 class="title" id="title">New chat</h1>
        <span class="subtitle" id="subtitle"></span>
      </div>

      <div class="model-picker" id="modelPicker">
        <button class="model-btn" id="modelBtn">
          <span class="dot"></span>
          <span id="modelLabel">Luna</span>
          <i class="ri-arrow-down-s-line"></i>
        </button>
        <div class="model-menu" id="modelMenu"></div>
      </div>
    </header>

    <section class="chat" id="chat">
      <div class="welcome" id="welcome">
        <div class="welcome-mark">M</div>
        <h1>How can I help?</h1>
        <p>Ask anything. Mirox will respond instantly.</p>
      </div>
    </section>

    <div class="composer-wrap">
      <form class="composer" id="composer">
        <button type="button" class="icon-btn" id="imageBtn" title="Image"><i class="ri-image-line"></i></button>
        <textarea id="input" rows="1" placeholder="Message Mirox…" autocomplete="off" spellcheck="true"></textarea>
        <button type="submit" class="send-btn" id="sendBtn" disabled>
          <i class="ri-arrow-up-line"></i>
        </button>
      </form>
      <p class="disclaimer">Mirox can make mistakes. Made by the <b>OpenSurr</b> team.</p>
    </div>
  </main>
</div>

<div class="overlay" id="loginModal">
  <div class="modal">
    <button class="modal-close" data-close><i class="ri-close-line"></i></button>
    <h2>Welcome to Mirox</h2>
    <p class="muted">Just your name and email — nothing else.</p>
    <form id="loginForm">
      <label>Name</label>
      <input type="text" id="loginName" placeholder="Your name" required maxlength="60">
      <label>Email</label>
      <input type="email" id="loginEmail" placeholder="you@example.com" required maxlength="120">
      <button type="submit" class="primary" id="loginBtn">Continue</button>
      <p class="status" id="loginStatus"></p>
    </form>
  </div>
</div>

<div class="overlay" id="imageModal">
  <div class="modal">
    <button class="modal-close" data-close><i class="ri-close-line"></i></button>
    <h2>Create an image</h2>
    <p class="muted">Describe what you want to see.</p>
    <textarea id="imagePrompt" rows="3" placeholder="A quiet lake at sunrise, mist drifting over the water…" maxlength="1000"></textarea>
    <button class="primary" id="imageGo"><i class="ri-magic-line"></i> Generate</button>
    <p class="status" id="imageStatus"></p>
    <div class="image-result" id="imageResult"></div>
  </div>
</div>

<script src="/script.js"></script>
</body>
</html>
