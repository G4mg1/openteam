<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>MiroxAI — Under Maintenance</title>
<link rel="icon" href="/logo.png" type="image/png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
  *,
  *::before,
  *::after { box-sizing: border-box; margin: 0; padding: 0; }

  html, body { height: 100%; }

  body {
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: #ffffff;
    color: #111111;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 24px;
    text-align: center;
    -webkit-font-smoothing: antialiased;
  }

  .maintenance {
    max-width: 560px;
    width: 100%;
  }

  .maintenance-logo {
    width: 56px;
    height: 56px;
    object-fit: contain;
    margin-bottom: 28px;
    border-radius: 14px;
  }

  .maintenance-badge {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: #b45309;
    background: #fef3c7;
    border: 1px solid #fde68a;
    padding: 6px 14px;
    border-radius: 999px;
    margin-bottom: 24px;
  }

  .maintenance-badge .dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: #f59e0b;
    animation: pulse 1.6s ease-in-out infinite;
  }

  @keyframes pulse {
    0%, 100% { opacity: 1; transform: scale(1); }
    50%      { opacity: 0.4; transform: scale(0.8); }
  }

  .maintenance-title {
    font-size: clamp(26px, 5vw, 38px);
    font-weight: 800;
    line-height: 1.2;
    letter-spacing: -0.02em;
    margin-bottom: 16px;
  }

  .maintenance-text {
    font-size: clamp(15px, 2.2vw, 17px);
    line-height: 1.6;
    color: #4b5563;
    font-weight: 500;
  }

  .maintenance-foot {
    margin-top: 40px;
    font-size: 13px;
    color: #9ca3af;
  }

  .maintenance-foot a {
    color: #6b7280;
    text-decoration: none;
    border-bottom: 1px solid #e5e7eb;
    transition: color 0.2s;
  }

  .maintenance-foot a:hover { color: #111111; }

  @media (prefers-color-scheme: dark) {
    body { background: #0a0a0a; color: #f5f5f5; }
    .maintenance-badge {
      color: #fbbf24;
      background: rgba(251, 191, 36, 0.1);
      border-color: rgba(251, 191, 36, 0.25);
    }
    .maintenance-text { color: #a3a3a3; }
    .maintenance-foot { color: #6b7280; }
    .maintenance-foot a { color: #9ca3af; border-bottom-color: #262626; }
    .maintenance-foot a:hover { color: #ffffff; }
  }
</style>
</head>
<body>

<div class="maintenance">
  <img class="maintenance-logo" src="/logo.png" alt="Mirox AI logo" onerror="this.style.display='none'">

  <div class="maintenance-badge">
    <span class="dot" aria-hidden="true"></span>
    Maintenance
  </div>

  <h1 class="maintenance-title">Mirox AI is under maintenance.</h1>
  <p class="maintenance-text">We'll be back soon.</p>

  <div class="maintenance-foot">
    Need help? <a href="mailto:support@miroxai.org">mirox.org@gmail.com</a>
  </div>
</div>

</body>
</html>
